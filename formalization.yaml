      tool_setup: "AI research agents wrote the statements, the proofs and the Lean 4 + Mathlib formalization, and separate agents checked the statements against the source text."
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Statement-first formalization of written proofs."
  spend_usd: "not tracked"
  notes: "AI research agents built and directed by Tyler B. Hughes generated and checked this work. No human mathematician has yet refereed the proof."

fidelity:
  divergences: >-
    Lemma 3 is stated for the bottom side. Corollary A19 is stated as its
    sentence before the parentheses, which give its derivation. Theorem A18 is
    stated with the tiling and the corner condition inside the negation, as in
    the source. A rectangle is R a b, with lower-left cell (0, 0).

review:
  status: agent-reviewed
  reviewers:
    - "AI review agents directed by Tyler B. Hughes"
  notes: >-
    A separate agent of another model family rendered the statements back into
    words from the Lean text alone, and the renderings were compared with the
    source text (7 of 7 exact). Axioms are printed by
    PolyominoOddOrder/Verify.lean. Independent kernel verification is left to
    Palomar's report. No human mathematician has yet refereed the proof.

alignment:
  namespace: "PolyominoOddOrder"
  statements:
    - source: "Corollary 1a (crossing)"
      lean: "PolyominoOddOrder.corollary1a_crossing"
      module: "Solution"
      status: proved
      note: "Let a, b >= 2. If S is a connected subset of R meeting both the left and the right column, and S' is a connected subset of R meeting both the bottom and the top row, then S and S' share a cell."
    - source: "Lemma 2 (no tile holds two opposite corners)"
      lean: "PolyominoOddOrder.lemma2_no_opposite_corners"
      module: "Solution"
      status: proved
      note: "No tile contains two opposite corner cells of R. (Setting: P is a polyomino, k >= 2, and T_1, ..., T_k is a k-copy tiling of R(a, b) by P.)"
    - source: "Lemma 3 (two adjacent corners force the whole side)"
      lean: "PolyominoOddOrder.lemma3_adjacent_corners_full_row"
      module: "Solution"
      status: proved
      note: "Suppose a tile T contains the two corner cells (0, 0) and (a - 1, 0). Then T contains every cell of row 0. (Setting: P is a polyomino, k >= 2, and T_1, ..., T_k is a k-copy tiling of R(a, b) by P.)"
    - source: "Theorem 62 (three copies)"
      lean: "PolyominoOddOrder.theorem62_no_three_copy_tiling"
      module: "Solution"
      status: proved
      note: "No rectangle is tiled by exactly three congruent non-rectangular polyominoes (grid isometries, reflections included). Printed prior work (Maltby 1994; Stewart and Wormstein 1992); the proof here is a second proof."
    - source: "Theorem 21 (what a search without hits proves)"
      lean: "PolyominoOddOrder.theorem21_search_bridge"
      module: "Solution"
      status: proved
      note: "Fix n. Suppose that, over all rectangles and boxes allowed in section 1, no tuple of I(5), H1(5), H2(5), H1(3), H2(3) has a proper solution that is not a rectangle. Then no rectangle is tiled by exactly 3, and none by exactly 5, congruent copies of a non-rectangular polyomino with n cells. The search without hits is a hypothesis; no search is run or checked in Lean."
    - source: "Theorem A18 (case (I) does not occur)"
      lean: "PolyominoOddOrder.theoremA18_no_case_one_tiling"
      module: "Solution"
      status: proved
      note: "Let P be a polyomino that is not a rectangle. There is no 5-copy tiling T_1, ..., T_5 of a rectangle R(a, b) by P in which the four corner cells of R lie in four distinct tiles. Case (I) of five copies; with the internal theorem corners_in_distinct_tiles it gives Corollary A19."
    - source: "Corollary A19 (five copies)"
      lean: "PolyominoOddOrder.corollaryA19_no_five_copy_tiling"
      module: "Solution"
      status: proved
      note: "No rectangle is tiled by exactly five congruent copies of a non-rectangular polyomino. The words in parentheses in the source are its derivation and are not part of the statement."

