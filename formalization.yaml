# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Five congruent copies of a non-rectangular polyomino do not tile a rectangle, with the three-copy theorem"
  description: "Lean 4 + Mathlib formalization of 7 statements on tilings of a rectangle by congruent copies of one polyomino (rotations and reflections allowed): a crossing statement, two statements on tiles that hold two corner cells, the three-copy theorem (printed prior work, proved here a second time), a statement that reduces 3 and 5 copies at a given number of cells to a finite search, the statement that case (I) of five copies does not occur (Theorem A18), and Corollary A19. Corollary A19 is proved in Lean: no rectangle is tiled by exactly five congruent copies of a polyomino that is not a rectangle. Proved in Lean with standard axioms only: 7 of 7 statements, all witnessed. AI research agents built and directed by Tyler B. Hughes generated and checked this work. No human mathematician has yet refereed the proof."
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05B50", "05B45", "52C20"]

sources:
  - title: "No Rectangle Is Tiled by Five Congruent Copies of a Non-Rectangular Polyomino"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/polyomino-odd-order"
    type: original-proof
    location: "https://mathdiscoveries.org/results/polyomino-odd-order"
    relationship: other
    author_endorsement: participated
    note: >-
      The proofs formalized here. Theorem 62 (three copies) is printed prior
      work and is listed below; the proof of it here is a second proof.
      Computer search results of the companion work (its C5-T statements) are
      external to this package: no search is run or checked in Lean. AI research
      agents built and directed by Tyler B. Hughes generated and checked this
      work. No human mathematician has yet refereed the proof.
  - title: "Polyominoes of order 3 do not exist"
    authors:
      - "I. N. Stewart"
      - "A. Wormstein"
    id: "https://doi.org/10.1016/0097-3165(92)90058-3"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 61 (1992), 130-136"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Read in full. Its Theorem: if three congruent copies of a connected
      polyomino tile a rectangle, then the polyomino is itself rectangular
      (reflections allowed). This contains the statement of Theorem 62. It calls
      the existence of odd orders greater than one an open question.
  - title: "Trisecting a rectangle"
    authors:
      - "S. J. Maltby"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 66 (1994)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Read in full by an earlier agent unit of this work. It generalises the
      three-copy result to all trisections of a rectangle; Theorem 62 is its
      polyomino case.
  - title: "Some Open Problems in Polyomino Tilings"
    authors:
      - "Andrew Winslow"
    id: "https://doi.org/10.1007/978-3-319-98654-8_6"
    type: paper
    location: "Lecture Notes in Computer Science (2018), 74-82"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      In Developments in Language Theory (DLT 2018). Read in full in the
      author's copy, where the question is Open Problem 11: "Is there a
      polyomino of order 5?". Corollary A19 of this package answers it; the
      notion of order is not defined in the package. The Springer version of
      record is unread [to check].
  - title: "Tiling Rectangles and Half Strips with Congruent Polyominoes"
    authors:
      - "Michael Reid"
    id: "https://doi.org/10.1006/jcta.1997.2788"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 80 (1997), 106-123"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      On rectangles tiled by an odd number of copies of a polyomino. Read in
      full in the author's preprint, not in the version of record.
  - title: "Intensive use of computing resources for dominations in grids and other combinatorial problems"
    authors:
      - "Alexandre Talon"
    id: "https://arxiv.org/abs/2002.11615"
    type: thesis
    location: "arXiv:2002.11615 (2020)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Chapter 4 read. Page 96 says it is not known whether there are polyominoes
      of order 5.
  - title: "No polyomino with at most 24 cells tiles a rectangle with exactly 5, 7 or 9 copies"
    authors:
      - "fransys-code (GitHub account)"
    id: "https://github.com/fransys-code/polyomino-odd-rectangles"
    type: other
    location: "GitHub repository, created 2026-11-22"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      README read. An exhaustive computer search: no non-rectangular polyomino
      with at most 24 cells tiles a rectangle with exactly 5, 7 or 9 copies (its
      French summary says that size 24 is still running). It calls the general
      question open and says the search has not been checked by a third party.
  - title: "Comment on MathOverflow question 11753, Cutting a rectangle into an odd number of congruent non-rectangular pieces"
    authors:
      - "Zomulgustar (MathOverflow user)"
    id: "https://mathoverflow.net/questions/11753#comment587390_12239"
    type: web discussion
    location: "MathOverflow, comment of 2016-04-27 on an answer"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Read in full. An exhaustive search of the non-rectangular polyominoes with
      at most 13 cells found no rectangle tiled by 5, 7 or 9 copies, with "a few
      13-ominos left".
  - title: "Dissecting a square into congruent polygons"
    authors:
      - "Hui Rao"
      - "Lei Ren"
      - "Yang Wang"
    id: "https://doi.org/10.23638/dmtcs-22-1-21"
    type: paper
    location: "Discrete Mathematics & Theoretical Computer Science 22 (2020)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The arXiv version (2001.03289 v3) read. A square cut into
      an odd number of congruent convex polygons; it reports that Yuan,
      Zamfirescu and Zamfirescu (2016) prove that for five tiles the convex
      polygon is a rectangle, and proves the same for convex q-gons with q >= 6
      and right-angle trapezoids. A polyomino that is not a rectangle is not
      convex.
  - title: "Dissecting the square into seven or nine congruent parts"
    authors:
      - "Gerardo L. Maldonado"
      - "Edgardo Roldán-Pensado"
    id: "https://doi.org/10.1016/j.disc.2022.112800"
    type: paper
    location: "Discrete Mathematics (2022)"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      The arXiv version (2104.04940 v4) read; the published version [to check].
      It reports that
      Yuan, Zamfirescu and Zamfirescu verified the convex case for five tiles,
      and that a conjecture attributed to Danzer, for five congruent polygons
      that need not be convex, remains open. A polyomino that is not a rectangle
      is not convex.

related_formalizations: []

status:
  scope: >-
    Proved in Lean 4 + Mathlib with standard axioms only: 7 of 7 statements, all witnessed
    (compared statements; witnessed means that their hypotheses are shown to
    be satisfiable in PolyominoOddOrder/Sanity.lean). Corollary A19 is proved in Lean: no rectangle is tiled by exactly five congruent copies of a polyomino that is not a rectangle. The internal
    theorems corners_in_distinct_tiles, sides_are_intervals,
    corner_tile_sides and free_tile_one_side (Corollary 63, Proposition 57 (a)
    and (b), Corollary 59 with Proposition 60 of the companion work) are steps
    of its proof, not compared statements, and are not counted. Theorem 21
    takes a search without hits at a given number of cells as a hypothesis;
    C5-T search results are external to this package and are neither run nor
    checked in Lean.
    sorry_count does not count the sorry bodies of the statements in
    Challenge.lean, which Solution.lean proves.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

